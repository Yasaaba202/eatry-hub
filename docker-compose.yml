services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eatry_hub
      POSTGRES_USER: eatry_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-eatry-dev-only}
    ports:
      - "5433:5432"
    volumes:
      - eatry_hub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eatry_hub -d eatry_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eatry_hub_postgres:
